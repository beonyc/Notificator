spring:
  application:
    name: Notificator
  datasource:
    # Файловая H2: данные лежат в ./data/tracker.mv.db и переживают перезапуск
    url: jdbc:h2:file:./data/tracker;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      # Hibernate сам создаёт и обновляет таблицы по сущностям (для боевого запуска — Flyway)
      ddl-auto: update
notifications:
  # Время считается по часовому поясу пользователя (User.timezone), а не сервера
  summary-time: "08:00"            # утренний итог вчерашнего дня
  weekly-report-time: "00:05"      # по понедельникам: итоги прошедшей недели (пн–вс)
  reminder-times: "13:00,17:00,21:00"  # напоминания о невыполненных делах
  catch-up-minutes: 30             # сколько минут после назначенного времени ещё можно отправить (если бот был недоступен)
  quote-repeat-days: 7             # одну цитату не повторяем чаще, чем раз в N дней
telegram:
  # Токен берётся из переменной окружения TELEGRAM_BOT_TOKEN (в git не попадает).
  # Значения по умолчанию нет намеренно: без переменной приложение не запустится.
  botToken: ${TELEGRAM_BOT_TOKEN}