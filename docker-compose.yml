# ============================================================================
# docker-compose.yml — описание того, как запускать контейнер на сервере.
# Одна команда `docker compose up -d --build` собирает образ и запускает бота.
# ============================================================================
services:
  notificator:
    # Собираем образ из Dockerfile в корне проекта.
    build: .
    container_name: notificator

    # Автоперезапуск: после сбоя приложения и после перезагрузки сервера.
    # Остановить вручную можно `docker compose stop` — тогда сам не поднимется.
    restart: unless-stopped

    # Токен бота берётся из файла .env (в git он не попадает, см. .env.example).
    # Так секрет не зашит ни в образ, ни в репозиторий.
    env_file: .env

    # Часовой пояс сервера (уведомления считаются по поясу пользователя,
    # но в логах удобнее видеть привычное время).
    environment:
      TZ: Europe/Moscow

    # Именованные тома: данные H2 и логи живут вне контейнера
    # и переживают пересборку и обновление образа.
    volumes:
      - notificator-data:/app/data
      - notificator-logs:/app/logs

    # Порты не открываем: бот сам обращается к Telegram (long polling),
    # входящих подключений ему не нужно.

volumes:
  notificator-data:
  notificator-logs:
